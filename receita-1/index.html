<!DOCTYPE html>

<html>
    <head>
        <title> Bar dos Trovadores </title>  

        <style>
            table {
                width: 25%;
                border-collapse: collapse;
                margin-bottom: 20px;
            }

            th, td {
                padding: 12px 15px;
                border: 1px solid #ddd;
                text-align: center;
            }

            th {
                background-color: #f2f2f2;
                font-weight: bold;
            }

            .table-container {
                display: flex;
                justify-content: space-around; 
                align-items: flex-start; 
            }

            .table-container table {
                width: 48%; 
            }
        </style>
    </head>
   <body>

      <img src="https://akamai.sscdn.co/uploadfile/letras/playlists/3/a/b/9/3ab92363f7974d679f4194de9f389b5b.jpg" width="200"/>

      <h1>Uma trova...</h1>

      <p>

         Eu só preciso de hoje<br/>      

         Pra viver e ser feliz<br/>

         O passado já me foge<br/>

         E o futuro nada diz!<br/>

      </p>
      <br/>

      <div class="table-container">
        <table>
            <tr>
                <th> Bebida </th>
                <th> Preco </th>
            </tr>
        </table>
        <table>
            <tr>
                <th> Lanche </th>
                <th> Preco </th>
            </tr>
        </table>
      </div>
      <br/>

      <p>

         Autor: Francisco Borges

      </p>
      <br/>

   </body>     

</html>
